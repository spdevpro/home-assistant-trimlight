[project]
name = "home-assistant-trimlight"
version = "0.1.1"
description = "Local Home Assistant integration for Trimlight controllers"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
dependencies = []

[dependency-groups]
test = [
  "aiotrimlight==0.3.0",
  "mypy>=1.19.0,<2",
  "pytest-homeassistant-custom-component==0.13.361",
  "ruff>=0.13.0,<1",
  "zizmor>=1.18.0,<2",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components.trimlight"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
files = ["custom_components", "tests"]

[[tool.mypy.overrides]]
module = "pytest_homeassistant_custom_component.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "homeassistant.components.light"
implicit_reexport = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]
